name: Build Mac & Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (留空则默认使用 tauri.conf.json 中的版本号)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri and Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (inputs.tag_name != '' && inputs.tag_name) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v__VERSION__' }}
          releaseName: ${{ (inputs.tag_name != '' && inputs.tag_name) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'MusicTag v__VERSION__' }}
          releaseBody: 'MusicTag Mac & Windows 定制增强版（支持批量统一编辑、批量与单曲智能刮削、清空撤销与上下键快速翻页）'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musictag-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn
